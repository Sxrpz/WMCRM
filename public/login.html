<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 客户开发 CRM</title>
<style>
  :root{
    --paper: #F3F1EC;
    --panel: #FFFFFF;
    --ink: #22282A;
    --ink-soft: #5B6462;
    --line: #DCDCD3;
    --teal: #33565A;
    --teal-deep: #223E42;
    --copper: #B5602E;
    --red: #A83232;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:32px 30px; width:100%; max-width:380px; position:relative;
  }
  .corner{ position:absolute; width:14px; height:14px; }
  .corner::before, .corner::after{ content:""; position:absolute; background:var(--copper); }
  .corner.tl{ top:-1px; left:-1px; } .corner.tr{ top:-1px; right:-1px; }
  .corner.bl{ bottom:-1px; left:-1px; } .corner.br{ bottom:-1px; right:-1px; }
  .corner::before{ width:14px; height:2px; } .corner::after{ width:2px; height:14px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:0.14em; color:var(--copper); text-transform:uppercase; margin:0 0 6px; }
  h1{ font-size:21px; color:var(--teal-deep); margin:0 0 22px; }
  label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  input[type=password]{
    width:100%; padding:10px 11px; font-size:14px; border:1px solid var(--line); border-radius:3px;
    background:#FBFAF7; font-family:var(--sans); color:var(--ink);
  }
  input[type=password]:focus{ outline:none; border-color:var(--teal); }
  .btn{
    width:100%; margin-top:18px; padding:10px; border-radius:3px; font-size:14px; font-weight:600;
    cursor:pointer; font-family:var(--sans); border:1px solid var(--teal); background:var(--teal); color:#fff;
  }
  .btn:hover{ background:var(--teal-deep); border-color:var(--teal-deep); }
  .btn[disabled]{ opacity:0.6; cursor:default; }
  .error{
    display:none; margin-top:13px; font-size:13px; color:var(--red);
    padding:8px 10px; background:#F6E4E4; border-radius:3px;
  }
  .error.show{ display:block; }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <p class="eyebrow">Customer Development CRM</p>
    <h1>客户开发 CRM 登录</h1>
    <label for="password">登录密码</label>
    <input type="password" id="password" autocomplete="current-password" autofocus required>
    <div class="error" id="error"></div>
    <button class="btn" type="submit" id="submit-btn">登 录</button>
  </form>

<script>
document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errBox = document.getElementById('error');
  const password = document.getElementById('password').value;
  btn.disabled = true;
  errBox.classList.remove('show');
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password })
    });
    if(res.ok){
      window.location.href = '/';
      return;
    }
    const data = await res.json().catch(()=> ({}));
    errBox.textContent = data.error || '登录失败';
    errBox.classList.add('show');
  } catch(err){
    errBox.textContent = '无法连接服务器，请稍后重试';
    errBox.classList.add('show');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
